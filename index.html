
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Ultimate URL Encryptor</title>

<meta name="robots" content="noindex,nofollow,noarchive,nosnippet,noimageindex">
<meta name="googlebot" content="noindex,nofollow,noarchive,nosnippet">
<meta name="theme-color" content="#0b1020">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

<style>

:root{
--bg:#030712;
--card:rgba(255,255,255,.08);
--border:rgba(255,255,255,.12);
--text:#ffffff;
--muted:#94a3b8;
--accent:#00e5ff;
--accent2:#8b5cf6;
--success:#10b981;
}

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Inter',sans-serif;
}

body{
background:
radial-gradient(circle at top left,#1e3a8a 0%,transparent 35%),
radial-gradient(circle at top right,#7c3aed 0%,transparent 35%),
radial-gradient(circle at bottom,#0891b2 0%,transparent 30%),
var(--bg);
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
padding:30px;
overflow-x:hidden;
}

.container{
width:100%;
max-width:1100px;
background:var(--card);
backdrop-filter:blur(30px);
-webkit-backdrop-filter:blur(30px);
border:1px solid var(--border);
border-radius:30px;
padding:35px;
box-shadow:
0 20px 60px rgba(0,0,0,.5),
0 0 80px rgba(0,229,255,.08);
}

.header{
text-align:center;
margin-bottom:30px;
}

.logo{
font-size:60px;
margin-bottom:10px;
}

.title{
font-size:clamp(2rem,4vw,3.5rem);
font-weight:900;
background:linear-gradient(90deg,#00e5ff,#8b5cf6,#00e5ff);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}

.subtitle{
margin-top:10px;
color:var(--muted);
}

.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:25px;
}

@media(max-width:900px){
.grid{
grid-template-columns:1fr;
}
}

.panel{
background:rgba(255,255,255,.05);
border:1px solid rgba(255,255,255,.08);
border-radius:24px;
padding:22px;
}

label{
display:block;
font-weight:700;
margin-bottom:10px;
}

input,textarea{
width:100%;
padding:16px;
border-radius:16px;
border:1px solid rgba(255,255,255,.08);
background:rgba(255,255,255,.05);
color:white;
outline:none;
font-size:15px;
}

input:focus,
textarea:focus{
border-color:var(--accent);
box-shadow:0 0 25px rgba(0,229,255,.15);
}

textarea{
min-height:220px;
resize:vertical;
}

.buttons{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:12px;
margin-top:20px;
}

button{
border:none;
padding:15px;
border-radius:16px;
font-size:15px;
font-weight:700;
cursor:pointer;
transition:.25s;
}

button:hover{
transform:translateY(-3px);
}

.encrypt{
background:linear-gradient(135deg,#00e5ff,#2563eb);
color:white;
}

.decrypt{
background:linear-gradient(135deg,#8b5cf6,#ec4899);
color:white;
}

.copy{
background:linear-gradient(135deg,#10b981,#059669);
color:white;
}

.clear{
background:linear-gradient(135deg,#ef4444,#dc2626);
color:white;
}

.output{
min-height:220px;
background:#020617;
border-radius:18px;
padding:18px;
word-break:break-all;
overflow:auto;
font-family:monospace;
border:1px solid rgba(255,255,255,.08);
}

.stats{
display:flex;
gap:15px;
margin-top:20px;
flex-wrap:wrap;
}

.stat{
flex:1;
min-width:140px;
padding:15px;
border-radius:16px;
background:rgba(255,255,255,.05);
text-align:center;
}

.stat h3{
font-size:1.4rem;
}

.footer{
text-align:center;
margin-top:25px;
color:var(--muted);
font-size:14px;
}

.glow{
position:fixed;
width:400px;
height:400px;
border-radius:50%;
filter:blur(120px);
pointer-events:none;
opacity:.15;
}

.g1{
background:#00e5ff;
top:-100px;
left:-100px;
}

.g2{
background:#8b5cf6;
right:-100px;
bottom:-100px;
}

</style>
</head>
<body>

<div class="glow g1"></div>
<div class="glow g2"></div>

<div class="container">

<div class="header">
<div class="logo">🔐</div>
<div class="title">Ultimate URL Encryptor</div>
<div class="subtitle">
AES-GCM Secure Encryption • Browser Only • No Server Required
</div>
</div>

<div class="grid">

<div class="panel">

<label>Secret Key</label>
<input type="password" id="password" placeholder="Enter secret key">

<br><br>

<label>URL / Text</label>
<textarea id="input"
placeholder="https://example.com/page?id=123"></textarea>

<div class="buttons">
<button class="encrypt" onclick="encryptData()">
Encrypt
</button>

<button class="decrypt" onclick="decryptData()">
Decrypt
</button>

<button class="copy" onclick="copyOutput()">
Copy
</button>

<button class="clear" onclick="clearAll()">
Clear
</button>
</div>

</div>

<div class="panel">

<label>Output</label>

<div class="output" id="output">
Encrypted or decrypted data appears here...
</div>

<div class="stats">

<div class="stat">
<h3 id="chars">0</h3>
<p>Characters</p>
</div>

<div class="stat">
<h3 id="words">0</h3>
<p>Words</p>
</div>

<div class="stat">
<h3 id="size">0</h3>
<p>Bytes</p>
</div>

</div>

</div>

</div>

<div class="footer">
Ultimate UI • AES-GCM Encryption • 100% Client Side
</div>

</div>

<script>

async function getKey(password){

const hash = await crypto.subtle.digest(
"SHA-256",
new TextEncoder().encode(password)
);

return crypto.subtle.importKey(
"raw",
hash,
{name:"AES-GCM"},
false,
["encrypt","decrypt"]
);

}

async function encryptData(){

const password =
document.getElementById("password").value;

const text =
document.getElementById("input").value;

if(!password || !text){
alert("Enter both key and URL/text");
return;
}

const key = await getKey(password);

const iv =
crypto.getRandomValues(new Uint8Array(12));

const encrypted =
await crypto.subtle.encrypt(
{name:"AES-GCM",iv},
key,
new TextEncoder().encode(text)
);

const combined =
new Uint8Array(iv.length + encrypted.byteLength);

combined.set(iv);
combined.set(new Uint8Array(encrypted),iv.length);

const result =
btoa(String.fromCharCode(...combined))
.replace(/\+/g,"-")
.replace(/\//g,"_")
.replace(/=/g,"");

document.getElementById("output").textContent=result;

updateStats(result);

}

async function decryptData(){

try{

const password =
document.getElementById("password").value;

let data =
document.getElementById("input").value;

const key = await getKey(password);

data = data
.replace(/-/g,"+")
.replace(/_/g,"/");

while(data.length % 4)
data += "=";

const bytes =
Uint8Array.from(
atob(data),
c=>c.charCodeAt(0)
);

const iv = bytes.slice(0,12);
const encrypted = bytes.slice(12);

const decrypted =
await crypto.subtle.decrypt(
{name:"AES-GCM",iv},
key,
encrypted
);

const text =
new TextDecoder().decode(decrypted);

document.getElementById("output").textContent=text;

updateStats(text);

}catch{

document.getElementById("output").textContent =
"Invalid key or encrypted data.";

}

}

function copyOutput(){

navigator.clipboard.writeText(
document.getElementById("output").textContent
);

alert("Copied successfully");

}

function clearAll(){

document.getElementById("input").value="";
document.getElementById("password").value="";
document.getElementById("output").textContent=
"Encrypted or decrypted data appears here...";

updateStats("");

}

function updateStats(text){

document.getElementById("chars").textContent =
text.length;

document.getElementById("words").textContent =
text.trim() ? text.trim().split(/\s+/).length : 0;

document.getElementById("size").textContent =
new TextEncoder().encode(text).length;

}

</script>

</body>
</html>
